name: Temporary audited lockfile refresh

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  regenerate-lockfile:
    name: Regenerate patched Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/bootstrap
      - name: Resolve current patched semver-compatible transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p tokio --precise 1.53.3
          cargo update -p quinn-proto --precise 0.11.18
          cargo update -p rustls --precise 0.23.46
          cargo update -p rustls-webpki --precise 0.103.16
          cargo update -p webpki-roots@1.0.9 --precise 1.0.10
          cargo update -p chacha20 --precise 0.10.2
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          printf 'CARGO_LOCK_BEGIN\n'
          base64 -w0 Cargo.lock
          printf '\nCARGO_LOCK_END\n'
