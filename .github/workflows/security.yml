name: Security and workflow policy

on:
  pull_request:
  merge_group:
  push:
    branches: [main, dev]
  schedule:
    - cron: '17 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 workflow/self_test.py --ci
