name: Pull request gate

on:
  pull_request:
    branches: [dev]
  merge_group:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true

env:
  CI_BASE_REF: origin/dev

jobs:
  metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 workflow/validate_pr.py

  fast:
    name: Fast deterministic gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ./scripts/bootstrap
      - run: ./ci/run fast
      - name: Upload deterministic gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fast-ci-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/bootstrap
      - run: ./scripts/bootstrap-audit
      - run: ./ci/run audit

  pr-tests:
    name: PR test/build gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ./scripts/bootstrap
      - run: ./ci/run pr
      - name: Upload PR gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-ci-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
