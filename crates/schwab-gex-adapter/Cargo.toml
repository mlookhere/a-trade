[package]
name = "schwab-gex-adapter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
gex-engine = { path = "../gex-engine" }
futures-util = "=0.3.34"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "=2.5.8"
